<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ne İçin Çalıştığını Unutma</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#20242b;background:#f6f7fa}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #e7e9ef;padding:28px max(24px,calc((100vw - 1150px)/2))}header small{letter-spacing:.18em;font-weight:800;color:#858b99}h1{font-size:clamp(27px,4vw,43px);letter-spacing:-.045em;margin:8px 0}header p{color:#7b8290;margin:0}.wrap{max-width:1198px;padding:30px 24px;margin:auto}.tools{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:24px}.tools input{flex:1;max-width:420px}input,textarea{font:inherit;border:1px solid #dce0e8;border-radius:12px;padding:13px;background:white;width:100%;color:#242934}textarea{resize:vertical;min-height:95px}button,.button{border:0;border-radius:12px;padding:13px 18px;background:#232937;color:white;font:inherit;font-weight:650;cursor:pointer}button:hover{opacity:.87}.muted{color:#8a909b}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:white;border:1px solid #e8eaf0;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px #27354b09}.photo{height:205px;background:#f0f1f4;display:flex;align-items:center;justify-content:center;color:#a2a8b3;font-size:14px}.photo img{height:100%;width:100%;object-fit:cover}.body{padding:21px}.body h2{font-size:21px;margin:0 0 10px;letter-spacing:-.03em}.stars{display:flex;gap:2px;align-items:center}.stars svg{width:23px;height:23px}.ratingline{display:flex;gap:10px;align-items:center;color:#838a96;font-size:13px}.price{display:inline-block;position:relative;font-size:24px;font-weight:800;margin:16px 0 10px;z-index:0}.price:before{content:'';position:absolute;left:-5px;right:-5px;top:40%;height:55%;background:#ffe56e;transform:rotate(-1.5deg);z-index:-1;border-radius:3px}.date{font-size:12px;color:#9298a3;margin-bottom:12px}.reason{font-size:14px;line-height:1.6;white-space:pre-wrap;min-height:42px}.link{display:inline-flex;color:#3b537b;text-decoration:none;font-weight:750;font-size:14px;margin:12px 0}.actions{display:flex;gap:8px;border-top:1px solid #f0f0f3;padding-top:14px;margin-top:8px}.actions button{background:#f1f2f6;color:#424956;padding:9px 12px;font-size:13px}.empty{text-align:center;padding:70px 15px;color:#858b97}.modal{position:fixed;inset:0;background:#161d2a99;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.open{display:flex}.panel{background:white;border-radius:22px;padding:25px;width:min(100%,530px);max-height:92vh;overflow:auto}.panel h2{margin:0 0 20px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.foot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.secondary{background:#edf0f5;color:#333}.ratingpick{display:flex;align-items:center;gap:12px}.ratingpick input{flex:1}footer{text-align:center;color:#a0a5af;padding:30px;font-size:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){.grid{grid-template-columns:1fr}.tools{align-items:stretch;flex-direction:column}.tools input{max-width:none}.two{grid-template-columns:1fr}header{padding:24px}.wrap{padding:22px 16px}}
</style></head><body><header><small>NICU / KİŞİSEL HEDEFLER</small><h1>Ne İçin Çalıştığını Unutma.</h1><p>İstediğin şeyleri bir yerde tut. Hedeflerini hep hatırla.</p></header><main class="wrap"><div class="tools"><input id="search" placeholder="Hedeflerinde ara…" aria-label="Hedeflerde ara"><button id="add">+ Yeni hedef ekle</button></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>Henüz hedef yok. İlk hedefini ekle ✨</div></main><footer>NICU · Hedeflerin sana özel · Bu sürüm verileri yalnızca bu tarayıcıda saklar.</footer><div class="modal" id="modal"><div class="panel"><h2 id="formTitle">Yeni hedef</h2><form id="form"><div class="field"><label for="name">Ürün / hedef adı *</label><input id="name" required maxlength="120"></div><div class="field"><label for="photo">Ürün fotoğrafı</label><input id="photo" type="file" accept="image/*"><small class="muted">Fotoğraf seçmezsen mevcut fotoğraf korunur.</small></div><div class="two"><div class="field"><label for="price">Fiyat (₺)</label><input id="price" type="number" min="0" step="0.01" placeholder="12999"></div><div class="field"><label for="date">Tarih</label><input id="date" type="date"></div></div><div class="field"><label for="rating">Ne kadar istiyorsun? (0–5)</label><div class="ratingpick"><input id="rating" type="range" min="0" max="5" step="0.5" value="4.5"><span id="ratingVal">4,5</span></div><div id="ratingPreview"></div></div><div class="field"><label for="url">Ürün bağlantısı (URL)</label><input id="url" type="url" placeholder="https://..."></div><div class="field"><label for="reason">Neden istiyorsun?</label><textarea id="reason" maxlength="1500" placeholder="Bu hedef benim için neden önemli?"></textarea></div><div class="foot"><button type="button" class="secondary" id="cancel">Vazgeç</button><button type="submit">Kaydet</button></div></form></div></div><script>
const KEY='nicu_goals_v1';let goals=[];try{goals=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(goals))goals=[]}catch{goals=[]}let editing=null,existingPhoto='';const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(goals));const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2}).format(n)+' ₺';function stars(value){let n=Math.max(0,Math.min(5,Number(value)||0));return '<span class="stars" aria-label="'+n.toLocaleString('tr-TR')+' / 5 yıldız">'+Array.from({length:5},(_,i)=>{let fill=Math.max(0,Math.min(1,n-i))*100;let id='s'+Math.random().toString(36).slice(2);return `<svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="${id}"><stop offset="${fill}%" stop-color="#f3b83e"/><stop offset="${fill}%" stop-color="#fff"/></linearGradient></defs><path d="M12 2.3 15.05 8.6 22 9.6 17 14.5 18.2 21.4 12 18.15 5.8 21.4 7 14.5 2 9.6 8.95 8.6Z" fill="url(#${id})" stroke="#e7ad35" stroke-width="1.2" stroke-linejoin="round"/></svg>`}).join('')+'</span>'}function render(){let term=$('search').value.toLocaleLowerCase('tr-TR').trim();let items=goals.filter(g=>[g.name,g.reason].join(' ').toLocaleLowerCase('tr-TR').includes(term));$('grid').innerHTML=items.map(g=>`<article class="card"><div class="photo">${g.photo?`<img src="${safe(g.photo)}" alt="${safe(g.name)}">`:'Fotoğraf eklenmedi'}</div><div class="body"><h2>${safe(g.name)}</h2><div class="ratingline">${stars(g.rating)}<span>${Number(g.rating).toLocaleString('tr-TR')} / 5</span></div>${g.price!==''&&g.price!=null?`<div><span class="price">${money(Number(g.price))}</span></div>`:''}<div class="date">${safe(g.date||'Tarih belirtilmedi')}</div><div class="reason">${safe(g.reason||'Henüz açıklama eklenmedi.')}</div>${/^https?:\/\//i.test(g.url||'')?`<a class="link" href="${safe(g.url)}" target="_blank" rel="noopener noreferrer">Ürünü İncele ↗</a>`:''}<div class="actions"><button data-edit="${safe(g.id)}">Düzenle</button><button data-delete="${safe(g.id)}">Sil</button></div></div></article>`).join('');$('empty').hidden=items.length>0}function openForm(id=null){editing=id;let g=goals.find(x=>x.id===id);$('form').reset();existingPhoto=g?.photo||'';$('formTitle').textContent=g?'Hedefi düzenle':'Yeni hedef';$('name').value=g?.name||'';$('price').value=g?.price??'';$('date').value=g?.date||new Date().toLocaleDateString('sv-SE');$('rating').value=g?.rating??4.5;$('url').value=g?.url||'';$('reason').value=g?.reason||'';updateRating();$('modal').classList.add('open')}function closeForm(){$('modal').classList.remove('open')}function updateRating(){$('ratingVal').textContent=Number($('rating').value).toLocaleString('tr-TR');$('ratingPreview').innerHTML=stars($('rating').value)}$('rating').addEventListener('input',updateRating);$('add').onclick=()=>openForm();$('cancel').onclick=closeForm;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeForm()});$('search').addEventListener('input',render);$('grid').addEventListener('click',e=>{let edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit)openForm(edit.dataset.edit);if(del&&confirm('Bu hedefi silmek istiyor musun?')){goals=goals.filter(g=>g.id!==del.dataset.delete);save();render()}});function imageData(file){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let max=900,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.76))};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Fotoğraf okunamadı'))};img.src=url})}$('form').addEventListener('submit',async e=>{e.preventDefault();let file=$('photo').files[0];try{let photo=file?await imageData(file):existingPhoto;let goal={id:editing||crypto.randomUUID(),name:$('name').value.trim(),photo,price:$('price').value,date:$('date').value,rating:Number($('rating').value),url:$('url').value.trim(),reason:$('reason').value.trim()};if(!goal.name)return;if(editing)goals=goals.map(g=>g.id===editing?goal:g);else goals.unshift(goal);save();closeForm();render()}catch(err){alert('Kaydedilemedi. Fotoğrafı küçültmeyi deneyebilirsin. '+err.message)}});render();
</script></body></html>
